name: Revival boundary validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  scoped-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test src/tests/federation.test.ts src/tests/workflow.test.ts
      - run: npm ci --ignore-scripts --prefix modern
      - run: npm test --prefix modern
      - run: npm audit --omit=dev --prefix modern
